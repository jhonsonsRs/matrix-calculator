name: Build Windows .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle Qt DLLs (windeployqt)
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/MatrixCalculator.exe dist/
          windeployqt --release --no-translations dist/MatrixCalculator.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixCalculator-windows
          path: dist/
